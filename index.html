<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>航空技术英语</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="技术英语">
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --ink:#14202e; --muted:#5d6b7b; --line:#dbe2ea;
  --brand:#0f2a44; --on-brand:#fff; --accent:#e0a019; --ok:#1e8a4c; --ok-bg:#e3f4ea; --no:#c4362f; --no-bg:#fbe7e5;
  --chip:#e9eef4; --note-bg:#fff4dc; --note-fg:#76530a; --shadow:0 1px 2px rgba(16,32,48,.06),0 2px 8px rgba(16,32,48,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141c;--card:#16212d;--ink:#e6edf4;--muted:#93a3b4;--line:#263544;--brand:#86b8e8;--on-brand:#0d141c;--chip:#1e2b39;
  --ok:#4cc380;--ok-bg:#16301f;--no:#ef6b62;--no-bg:#3a1b19;--note-bg:#2e2610;--note-fg:#e9c86a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141c;--card:#16212d;--ink:#e6edf4;--muted:#93a3b4;--line:#263544;--brand:#86b8e8;--on-brand:#0d141c;--chip:#1e2b39;
  --ok:#4cc380;--ok-bg:#16301f;--no:#ef6b62;--no-bg:#3a1b19;--note-bg:#2e2610;--note-fg:#e9c86a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:20px;margin:0}
.top{padding:28px 0 12px}.top h1{font-size:26px;letter-spacing:.5px;color:var(--brand)}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}.pad{padding:0 2px}
.note{background:var(--note-bg);color:var(--note-fg);border-radius:10px;padding:10px 12px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.phase{font-size:13px;font-weight:600;color:var(--muted);margin:22px 2px 8px;letter-spacing:.3px}
.unit{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow)}
.unit:active{transform:scale(.99)}
.u-head{display:flex;justify-content:space-between;align-items:baseline}
.u-title{font-weight:600}.u-pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.u-desc{font-size:14px;color:var(--muted)}.u-miss{font-size:12px;color:var(--note-fg);margin-top:4px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.bar.thin{height:4px;margin:0 0 14px}
.bar-top{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.bar-top h1{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:var(--brand);padding:6px 4px;font-size:16px}
.prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.field{margin-bottom:14px}.label{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--chip);border:1px solid transparent;font-size:14px}
.chip input:checked+span{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.switch{display:flex;gap:10px;align-items:center;margin:4px 0 14px;font-size:15px}
.switch input{width:20px;height:20px;accent-color:var(--brand)}
.count{font-size:14px;color:var(--muted);margin:0 0 10px}
.btn{display:block;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);width:100%}
.btn.ghost b{color:var(--accent);margin-left:4px}.btn[disabled]{opacity:.5}
.btn.wide{width:100%;margin:10px 0}
.q-type{font-size:12px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.q-prompt{font-size:24px;font-weight:600;word-break:break-word}
.q-prompt.long{font-size:17px;font-weight:500;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px}
.opt.long{font-size:15px}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}.opt.wrong .k{background:var(--no);color:var(--card)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{font-weight:600;margin:14px 2px 0}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.ans .row-en{font-weight:500}
.say{background:var(--chip);border:0;border-radius:8px;padding:0 6px;margin-right:6px;font-size:14px;line-height:1.7;vertical-align:1px}
.list{margin-top:6px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row-en{word-break:break-word}.row-zh{color:var(--ink);opacity:.85;margin-top:2px}
.row-meta{font-size:12px;color:var(--muted);margin-top:4px}
.score{text-align:center}.big{font-size:56px;font-weight:700;color:var(--brand);line-height:1.1}.big small{font-size:24px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
.warn{color:var(--no)}.link.danger{color:var(--no);font-weight:600}
button:focus-visible,.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.star{flex:none;background:none;border:0;color:var(--accent);font-size:20px;line-height:1;padding:2px 4px}
.q-type{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row-head{display:flex;gap:8px;align-items:flex-start}.row-head .row-en{flex:1}
.u-exam{font-size:12px;color:var(--muted);margin-top:4px}
.rec-score{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.timer{font-weight:600}.timer.warn,.back.warn{color:var(--no)}
.opt.sel{border-color:var(--brand);background:var(--chip)}.opt.sel .k{background:var(--brand);color:var(--on-brand)}
.xnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:0 0 6px}
.cell{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font-size:13px;font-variant-numeric:tabular-nums}
.cell.done{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.row-pick{font-size:14px;margin-top:2px}.row-pick.no{color:var(--no)}.row-pick.ok{color:var(--ok)}
.btn.danger{color:var(--no)}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
